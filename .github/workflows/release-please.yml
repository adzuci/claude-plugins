name: Release Please

concurrency:
  group: ${{ github.workflow }}

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on:
      group: arc-scale-sets
      labels: general-low
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
