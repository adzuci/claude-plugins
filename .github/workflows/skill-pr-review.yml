name: Skill PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".claude/skills/**"
      - ".claude-plugin/**"
      - "plugins/**"
jobs:
  skill-review:
    uses: apolloio/.github/.github/workflows/skill-pr-review-reusable.yml@main
    secrets:
      anthropic-api-key: ${{ secrets.APOLLO_REVIEW_BOT_ANTHROPIC_KEY }}
