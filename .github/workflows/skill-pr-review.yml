name: Skill PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "plugins/**"
      - ".claude-plugin/**"

jobs:
  review-skill-pr:
    runs-on:
      group: arc-scale-sets
      labels: general-low
    permissions:
      pull-requests: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.APOLLO_REVIEW_BOT_ANTHROPIC_KEY }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
      MAX_DIFF_BYTES: "204800"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Review skill PR
        shell: bash
        run: |
          set -euo pipefail

          # --- helpers ---

          BOT_HEADER="🤖 **Skill Review Bot** — automated review powered by Claude"

          # Post a PR comment with the bot header prepended.
          bot_comment() {
            local body
            body="$(printf '%s\n\n%s\n' "${BOT_HEADER}" "$1")"
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${body}"
          }

          # Submit a PR review (APPROVE | REQUEST_CHANGES | COMMENT).
          post_review() {
            local event="$1" body="$2"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
              -f event="${event}" \
              -f body="${body}"
          }

          # --- preflight ---

          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            bot_comment "Automated review skipped: \`APOLLO_REVIEW_BOT_ANTHROPIC_KEY\` secret is not configured. A human review is needed."
            exit 0
          fi

          rubric_file=".github/skill-review-rubric.md"
          if [ ! -f "${rubric_file}" ]; then
            bot_comment "Automated review skipped: \`${rubric_file}\` is missing. A human review is needed."
            exit 0
          fi

          git fetch --no-tags origin "${BASE_REF}"

          changed_files="$(git diff --name-only --diff-filter=ACM "origin/${BASE_REF}...HEAD" -- plugins/ .claude-plugin/ || true)"
          if [ -z "${changed_files}" ]; then
            echo "No changed plugin files to review."
            exit 0
          fi

          # --- collect text file contents (up to MAX_DIFF_BYTES) ---

          # Use git's own binary detection: binary files show "-" in numstat.
          empty_tree="$(git hash-object -t tree /dev/null)"
          text_files="$(
            git diff --numstat "${empty_tree}" HEAD -- ${changed_files} \
              | awk '$1 != "-" { print $3 }'
          )"

          diff_payload=""
          bytes_used=0
          truncated=0
          reviewed_files=0

          while IFS= read -r file; do
            [ -n "${file}" ] || continue

            block="$(printf '### %s\n```\n%s\n```\n\n' "${file}" "$(git show "HEAD:${file}")")"
            block_size="${#block}"
            remaining=$((MAX_DIFF_BYTES - bytes_used))

            if [ "${remaining}" -le 0 ]; then
              truncated=1
              break
            fi

            if [ "${block_size}" -gt "${remaining}" ]; then
              diff_payload+="${block:0:${remaining}}"
              truncated=1
              break
            fi

            diff_payload+="${block}"
            bytes_used=$((bytes_used + block_size))
            reviewed_files=$((reviewed_files + 1))
          done <<< "${text_files}"

          if [ -z "${diff_payload}" ]; then
            bot_comment "No text-based files under \`plugins/\` or \`.claude-plugin/\` were eligible for automated review. A human review is needed."
            exit 0
          fi

          # --- call Anthropic API ---

          diff_file="$(mktemp)"
          printf '%s' "${diff_payload}" > "${diff_file}"

          prompt_json="$(mktemp)"
          jq -n \
            --rawfile rubric "${rubric_file}" \
            --rawfile diff_payload "${diff_file}" \
            --arg truncated "${truncated}" \
            --arg reviewed_files "${reviewed_files}" \
            '{
              model: "claude-opus-4-6",
              max_tokens: 1024,
              system: (
                "You are reviewing a GitHub pull request that adds or updates skills in a marketplace.\n" +
                "Use this condensed rubric derived from the skill-creator guidance.\n\n" +
                $rubric + "\n\n" +
                "Return exactly this format:\n" +
                "## Summary\n" +
                "One-paragraph overall assessment.\n\n" +
                "## Issues\n" +
                "- [ ] **[severity: error|warning|suggestion]** file:line — description\n\n" +
                "## Verdict\n" +
                "APPROVE | REQUEST_CHANGES | COMMENT\n"
              ),
              messages: [
                {
                  role: "user",
                  content: (
                    "Review only the following changed files from plugins/.\n" +
                    "Ignore files not shown here.\n" +
                    "Skip binary-file concerns because binaries were excluded before this request.\n" +
                    (
                      if $truncated == "1"
                      then "Note: The diff payload was truncated at 200KB, so not all changed files may be included.\n"
                      else ""
                      end
                    ) +
                    "Text files included: " + $reviewed_files + "\n\n" +
                    $diff_payload
                  )
                }
              ]
            }' > "${prompt_json}"

          response_json="$(mktemp)"
          http_code="$(
            curl --silent --show-error \
              --output "${response_json}" \
              --write-out "%{http_code}" \
              --request POST "https://api.anthropic.com/v1/messages" \
              --header "x-api-key: ${ANTHROPIC_API_KEY}" \
              --header "anthropic-version: 2023-06-01" \
              --header "content-type: application/json" \
              --data @"${prompt_json}" || true
          )"

          if ! printf '%s' "${http_code}" | grep -Eq '^2[0-9]{2}$'; then
            bot_comment "Automated review failed (HTTP ${http_code:-unknown}). A human review is needed."
            exit 0
          fi

          review_text="$(jq -r '[.content[]? | select(.type == "text") | .text] | join("\n")' "${response_json}")"
          if [ -z "${review_text}" ] || [ "${review_text}" = "null" ]; then
            bot_comment "Automated review failed: the API returned no review text. A human review is needed."
            exit 0
          fi

          # --- post results ---

          comment_body="${BOT_HEADER}"$'\n\n'"${review_text}"
          if [ "${truncated}" = "1" ]; then
            comment_body+=$'\n\n'"_Note: Review context was truncated to the first 200KB of text-based plugin changes._"
          fi

          verdict="$(printf '%s\n' "${review_text}" | awk '/^## Verdict/{getline; print; exit}' | tr -d '\r' | xargs)"
          case "${verdict}" in
            APPROVE|REQUEST_CHANGES|COMMENT) ;;
            *) verdict="COMMENT" ;;
          esac

          post_review "${verdict}" "${comment_body}"
