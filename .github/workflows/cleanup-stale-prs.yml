name: Clean Up Stale Pull Requests

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report candidates without deleting branches
        type: boolean
        default: true

concurrency:
  group: cleanup-stale-pull-requests

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  cleanup:
    uses: apolloio/.github/.github/workflows/cleanup-stale-pull-requests-reusable.yml@main
    with:
      dry-run: ${{ github.event_name == 'schedule' && vars.STALE_PR_AUTOCLOSE_ENABLED != 'true' || inputs.dry_run }}
      commit-days: 10
      ready-days: 10
      draft-days: 30
      extended-days: 35
      extended-label: flaky-test-fix
      keep-open-label: keep-open
      excluded-branches: main,master,develop,docs
      max-deletions: 10
