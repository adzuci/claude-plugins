name: Tests

on:
  pull_request:
    paths:
      - "tests/**"
      - "plugins/**/tests/**"
      - "plugins/**/scripts/**"
      - "plugins/**/skills/**"
      - "plugins/**/.claude-plugin/**"
      - "plugins/**/.codex-plugin/**"
      - ".agents/plugins/**"
      - ".claude/skills/**"
      - ".claude-plugin/**"
      - ".github/scripts/bump_plugin_versions.py"
      - ".github/workflows/bump-version.yml"
      - ".github/workflows/tests.yml"

jobs:
  pytest:
    runs-on:
      group: arc-scale-sets
      labels: general-low
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install requirements
        run: |
          shopt -s nullglob globstar
          for req in tests/requirements.txt plugins/**/scripts/requirements.txt plugins/**/tests/requirements.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done
      - name: Run pytest
        run: python -m pytest -q

  node-test:
    runs-on:
      group: arc-scale-sets
      labels: general-low
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run node --test
        run: |
          shopt -s nullglob globstar
          files=(plugins/**/*.test.js plugins/**/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No node test files found; skipping."
            exit 0
          fi
          node --test "${files[@]}"
