name: Tests

on:
  pull_request:
    paths:
      - "tests/**"
      - "plugins/**/tests/**"
      - "plugins/**/scripts/**"
      - "plugins/**/.claude-plugin/**"
      - ".claude-plugin/**"
      - ".github/workflows/tests.yml"

jobs:
  pytest:
    runs-on:
      group: arc-scale-sets
      labels: general-low
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install requirements
        run: |
          shopt -s nullglob globstar
          for req in tests/requirements.txt plugins/**/scripts/requirements.txt plugins/**/tests/requirements.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done
      - name: Run pytest
        run: python -m pytest -q
