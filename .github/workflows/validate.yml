name: Validate

on:
  pull_request:
    paths:
      - "plugins/**"
      - ".claude/skills/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".github/workflows/validate.yml"
      - "template/**"

jobs:
  validate:
    runs-on:
      group: arc-scale-sets
      labels: general-low
    steps:
      - uses: actions/checkout@v6
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate .
