name: Update skill inventory

on:
  push:
    branches: [main]
    paths:
      - "plugins/**/SKILL.md"
      - "plugins/**/.claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - ".github/scripts/update-skill-inventory.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-inventory:
    runs-on:
      group: arc-scale-sets
      labels: general-low
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate inventory files
        run: python3 .github/scripts/update-skill-inventory.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md SKILL_INVENTORY.md
          git diff --staged --quiet || (git commit -m "chore: update skill inventory [skip ci]" && git push)
