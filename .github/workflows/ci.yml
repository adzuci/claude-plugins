name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    name: Plugin metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile bundled Python scripts
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" \
            python -m compileall -q plugins

      - name: Validate Local AI shell scripts
        run: bash -n plugins/local-ai/skills/*/scripts/*.sh

      - name: Validate JSON manifests
        run: |
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool plugins/memory/.claude-plugin/plugin.json >/dev/null
          python -m json.tool plugins/memory/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/local-ai/.claude-plugin/plugin.json >/dev/null
          python -m json.tool plugins/local-ai/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/productivity/.claude-plugin/plugin.json >/dev/null
          python -m json.tool plugins/learning/.claude-plugin/plugin.json >/dev/null

      - name: Validate static site asset references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class SiteParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.srcs = []
                  self.hrefs = []
                  self.h1 = []
                  self.in_h1 = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "src" in attrs:
                      self.srcs.append(attrs["src"])
                  if "href" in attrs:
                      self.hrefs.append(attrs["href"])
                  if tag == "h1":
                      self.in_h1 = True

              def handle_endtag(self, tag):
                  if tag == "h1":
                      self.in_h1 = False

              def handle_data(self, data):
                  if self.in_h1:
                      self.h1.append(data.strip())

          def local(ref):
              return not ref.startswith(("http://", "https://", "data:", "mailto:", "#"))

          pages = sorted(Path("docs").glob("*.html"))
          if not pages:
              raise SystemExit("No site pages found under docs/")
          for path in pages:
              parser = SiteParser()
              parser.feed(path.read_text())
              missing = [
                  ref for ref in parser.srcs + parser.hrefs
                  if local(ref) and not (path.parent / ref.split("#")[0]).exists()
              ]
              if missing:
                  raise SystemExit(f"{path}: missing local refs: {missing}")
              if not parser.h1:
                  raise SystemExit(f"{path}: page has no H1")
          memory = SiteParser()
          memory.feed(Path("docs/memory.html").read_text())
          if "Memory as reliability practice" not in " ".join(memory.h1):
              raise SystemExit("Expected memory post H1 was not found")
          local_ai = SiteParser()
          local_ai.feed(Path("docs/local-ai.html").read_text())
          if "Two Macs, one local model pool" not in " ".join(local_ai.h1):
              raise SystemExit("Expected Local AI post H1 was not found")
          PY
