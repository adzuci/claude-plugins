name: Lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint*"
      - ".github/workflows/lint.yml"

jobs:
  markdownlint:
    runs-on:
      group: arc-scale-sets
      labels: general-low
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: List changed Markdown files
        run: git diff --name-only --diff-filter=ACMRT "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- "*.md" > /tmp/changed-md.txt
      - name: Run markdownlint
        run: |
          if [ -s /tmp/changed-md.txt ]; then
            xargs npx markdownlint-cli2 < /tmp/changed-md.txt
          fi

  mdformat:
    runs-on:
      group: arc-scale-sets
      labels: general-low
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mdformat mdformat-frontmatter
      - name: List changed Markdown files
        run: git diff --name-only --diff-filter=ACMRT "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- "*.md" > /tmp/changed-md.txt
      - name: Run mdformat
        run: |
          if [ -s /tmp/changed-md.txt ]; then
            xargs mdformat --check < /tmp/changed-md.txt
          fi
