# Calibration experiment, /auto-pr vs no-skill baseline. This is not an end-to-end launch gate.
tasks:
  - auto-pr-backend-smoke
  - auto-pr-regression-smoke
  - auto-pr-wrong-premise-smoke
  - auto-pr-validation-recovery-smoke
variants:
  # v1/v2 = pre/post review (see ../../../../references/harnessbench-evals.md).
  - auto-pr-v1
  - auto-pr-v2
baselineVariant: baseline
compare: variant
agents:
  # Pinned to this skill's target model; re-baseline if changed.
  - id: claudecode-sonnet
    model: claude-sonnet-5
    env: {}
oracle:
  env:
    # Shared gem path from the workflow; harmless locally.
    BUNDLE_PATH: /home/runner/.leadgenie-bundle
judge:
  # Differs from agent model; re-calibrate before changing (see harnessbench-evals.md#known-limitations-v1).
  model: anthropic:claude-sonnet-4-6
  env: {}
repetitions: 3 # flags disagreement across repetitions; no single-rep winner
