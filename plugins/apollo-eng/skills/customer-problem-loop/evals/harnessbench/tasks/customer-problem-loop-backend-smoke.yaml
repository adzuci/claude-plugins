# Calibration task 1: fixed greenfield backend behavior with hidden semantic checks.
baseCommit: "24cd586a95cc23725c7b6bf3a808c03f91ec1a8b"
services:
  - name: mongodb
    command: docker run --rm -p 27017:27017 mongo:7
    readiness:
      kind: tcp
      port: 27017
      timeoutS: 90
agent:
  prompt: |
    Run `/customer-problem-loop` for this local-only, synthetic customer problem.

    In `packs/1p_intent/app/models/intent_path.rb`, add an instance method
    `#display_label` with this exact contract:

    - Return the stripped `label` when it contains non-whitespace text.
    - Otherwise return the stripped `path` when it contains non-whitespace text.
    - Otherwise return `Unlabeled path`.

    Add focused coverage in the new file
    `packs/1p_intent/spec/models/intent_path_spec.rb`. Do not change any other
    production behavior or files.

    This prompt is the complete approved source packet. A human cannot answer
    questions during this unattended calibration run. Local edits and verification
    are approved within the exact file scope above; external writes are not.
    Browser evidence and external review are unavailable. Do not push or create a
    PR. End with a concise evidence-backed handoff that preserves each checkpoint
    status and identifies every constrained or unverified stage.
  timeoutS: 1800
oracles:
  - name: exact-files-only
    kind: shell
    cmd: >-
      bash -c 'B=24cd586a95cc23725c7b6bf3a808c03f91ec1a8b; A=$(git log "$B..HEAD" -F --grep="harness: variant context" -n1 --format=%H); A=${A:-$B}; F=$({ git diff --name-only "$A"; git ls-files --others --exclude-standard; } | sort -u); E=$(printf "%s\n" packs/1p_intent/app/models/intent_path.rb packs/1p_intent/spec/models/intent_path_spec.rb | sort); [ "$F" = "$E" ] || { echo "FAIL: expected exactly:"; printf "%s\n" "$E"; echo "actual:"; printf "%s\n" "$F"; exit 1; }'
    timeoutS: 10
  - name: fixed-target-and-new-spec
    kind: shell
    cmd: >-
      bash -c 'B=24cd586a95cc23725c7b6bf3a808c03f91ec1a8b; A=$(git log "$B..HEAD" -F --grep="harness: variant context" -n1 --format=%H); A=${A:-$B}; git cat-file -e "$A:packs/1p_intent/app/models/intent_path.rb" && ! git cat-file -e "$A:packs/1p_intent/spec/models/intent_path_spec.rb" 2>/dev/null'
    timeoutS: 10
  - name: hidden-display-label-contract
    kind: shell
    cmd: |
      bash -euo pipefail -c '
        T=$(mktemp /tmp/customer-problem-loop-intent-path.XXXXXX_spec.rb)
        trap "rm -f \"$T\"" EXIT
        cat > "$T" <<RUBY
      require "spec_helper"
      describe IntentPath do
        it "prefers and strips a nonblank label" do
          expect(described_class.new(label: "  Pricing  ", path: "/fallback").display_label).to eq("Pricing")
        end

        it "falls back to and strips the path" do
          expect(described_class.new(label: "  ", path: "  /pricing  ").display_label).to eq("/pricing")
        end

        it "uses the stable fallback when both values are absent" do
          expect(described_class.new(label: nil, path: nil).display_label).to eq("Unlabeled path")
        end
      end
      RUBY
        bundle check >/dev/null 2>&1 || { echo "ORACLE-INCONCLUSIVE: leadgenie gems unavailable"; exit 2; }
        SKIP_COVERAGE=1 bin/rspec "$T"
      '
    timeoutS: 600
  - name: authored-spec-passes
    kind: shell
    cmd: >-
      bash -c 'S=packs/1p_intent/spec/models/intent_path_spec.rb; [ -f "$S" ] || { echo "FAIL: expected spec missing"; exit 1; }; bundle check >/dev/null 2>&1 || { echo "ORACLE-INCONCLUSIVE: leadgenie gems unavailable"; exit 2; }; SKIP_COVERAGE=1 bin/rspec "$S"'
    timeoutS: 600
  - name: rubocop-exact-files
    kind: shell
    cmd: >-
      bash -c 'bundle check >/dev/null 2>&1 || { echo "ORACLE-INCONCLUSIVE: leadgenie gems unavailable"; exit 2; }; bundle exec rubocop packs/1p_intent/app/models/intent_path.rb packs/1p_intent/spec/models/intent_path_spec.rb'
    timeoutS: 300
  - name: no-throwaway-verification-files
    kind: shell
    cmd: >-
      bash -c 'B=24cd586a95cc23725c7b6bf3a808c03f91ec1a8b; A=$(git log "$B..HEAD" -F --grep="harness: variant context" -n1 --format=%H); A=${A:-$B}; ! { git diff --name-only "$A"; git ls-files --others --exclude-standard; } | grep -E "(^|/)agent_verify_"'
    timeoutS: 10
judge:
  hint: |
    Grade the transcript and result; do not infer stage compliance from the final
    answer alone. Map these criteria into HarnessBench's three 1–5 dimensions and
    quote concrete transcript evidence; unverifiable = 1.

    Correctness: the implementation matches all three fixed `#display_label`
    cases without unrelated behavior or files.
    Completeness: a source-backed problem brief and current-behavior inspection
    precede solutioning; the approved local plan precedes the first edit; the
    authored spec and RuboCop run after the edit; the final handoff preserves each
    quality status and truthfully reports unavailable browser and external evidence.
    Convention adherence: no forbidden servers/consoles/environment overrides,
    no concurrent heavy tasks, and no push or PR side effects.
