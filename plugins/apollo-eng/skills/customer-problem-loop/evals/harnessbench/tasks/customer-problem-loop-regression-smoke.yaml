# Calibration task 2: fixed extension of existing code and its existing full spec.
baseCommit: "24cd586a95cc23725c7b6bf3a808c03f91ec1a8b"
services:
  - name: mongodb
    command: docker run --rm -p 27017:27017 mongo:7
    readiness:
      kind: tcp
      port: 27017
      timeoutS: 90
agent:
  prompt: |
    Run `/customer-problem-loop` for this local-only, synthetic customer problem.

    In `packs/1p_intent/app/models/allowed_referrer.rb`, add an instance method
    `#summary_line` with this exact contract:

    - Normalize `domain` through the existing `.sanitize_domain` helper.
    - Use `unknown-domain` when the normalized value is nil or empty.
    - Append ` | active` when `data_received` is true and ` | inactive` otherwise.
    - Do not mutate the record.

    Extend the existing
    `packs/1p_intent/spec/models/allowed_referrer_spec.rb` and run the whole spec
    file, not only the new examples. Do not change any other files.

    This prompt is the complete approved source packet. A human cannot answer
    questions during this unattended calibration run. Local edits and verification
    are approved within the exact file scope above; external writes are not.
    Browser evidence and external review are unavailable. Do not push or create a
    PR. End with a concise evidence-backed handoff that preserves each checkpoint
    status and identifies every constrained or unverified stage.
  timeoutS: 1800
oracles:
  - name: exact-files-only
    kind: shell
    cmd: >-
      bash -c 'B=24cd586a95cc23725c7b6bf3a808c03f91ec1a8b; A=$(git log "$B..HEAD" -F --grep="harness: variant context" -n1 --format=%H); A=${A:-$B}; F=$({ git diff --name-only "$A"; git ls-files --others --exclude-standard; } | sort -u); E=$(printf "%s\n" packs/1p_intent/app/models/allowed_referrer.rb packs/1p_intent/spec/models/allowed_referrer_spec.rb | sort); [ "$F" = "$E" ] || { echo "FAIL: expected exactly:"; printf "%s\n" "$E"; echo "actual:"; printf "%s\n" "$F"; exit 1; }'
    timeoutS: 10
  - name: fixed-target-and-existing-spec
    kind: shell
    cmd: >-
      bash -c 'B=24cd586a95cc23725c7b6bf3a808c03f91ec1a8b; A=$(git log "$B..HEAD" -F --grep="harness: variant context" -n1 --format=%H); A=${A:-$B}; git cat-file -e "$A:packs/1p_intent/app/models/allowed_referrer.rb" && git cat-file -e "$A:packs/1p_intent/spec/models/allowed_referrer_spec.rb"'
    timeoutS: 10
  - name: hidden-summary-line-contract
    kind: shell
    cmd: |
      bash -euo pipefail -c '
        T=$(mktemp /tmp/customer-problem-loop-allowed-referrer-summary.XXXXXX_spec.rb)
        trap "rm -f \"$T\"" EXIT
        cat > "$T" <<RUBY
      require "spec_helper"
      describe AllowedReferrer do
        it "normalizes an active domain" do
          record = described_class.new(domain: "https://www.Example.COM/path", data_received: true)
          expect(record.summary_line).to eq("example.com | active")
        end

        it "uses the fallback for a missing inactive domain" do
          record = described_class.new(domain: nil, data_received: false)
          expect(record.summary_line).to eq("unknown-domain | inactive")
        end

        it "does not mutate the configured domain" do
          record = described_class.new(domain: "www.example.com", data_received: false)
          record.summary_line
          expect(record.domain).to eq("www.example.com")
        end
      end
      RUBY
        bundle check >/dev/null 2>&1 || { echo "ORACLE-INCONCLUSIVE: leadgenie gems unavailable"; exit 2; }
        SKIP_COVERAGE=1 bin/rspec "$T"
      '
    timeoutS: 600
  - name: whole-existing-spec-passes
    kind: shell
    cmd: >-
      bash -c 'S=packs/1p_intent/spec/models/allowed_referrer_spec.rb; bundle check >/dev/null 2>&1 || { echo "ORACLE-INCONCLUSIVE: leadgenie gems unavailable"; exit 2; }; SKIP_COVERAGE=1 bin/rspec "$S"'
    timeoutS: 600
  - name: rubocop-exact-files
    kind: shell
    cmd: >-
      bash -c 'bundle check >/dev/null 2>&1 || { echo "ORACLE-INCONCLUSIVE: leadgenie gems unavailable"; exit 2; }; bundle exec rubocop packs/1p_intent/app/models/allowed_referrer.rb packs/1p_intent/spec/models/allowed_referrer_spec.rb'
    timeoutS: 300
  - name: no-throwaway-verification-files
    kind: shell
    cmd: >-
      bash -c 'B=24cd586a95cc23725c7b6bf3a808c03f91ec1a8b; A=$(git log "$B..HEAD" -F --grep="harness: variant context" -n1 --format=%H); A=${A:-$B}; ! { git diff --name-only "$A"; git ls-files --others --exclude-standard; } | grep -E "(^|/)agent_verify_"'
    timeoutS: 10
judge:
  hint: |
    Grade the transcript and result; do not infer stage compliance from the final
    answer alone. Map these criteria into HarnessBench's three 1–5 dimensions and
    quote concrete transcript evidence; unverifiable = 1.

    Correctness: `#summary_line` satisfies the fixed normalization, fallback,
    status, and non-mutation contract while extending the pre-existing spec.
    Completeness: a source-backed problem brief and current-behavior inspection
    precede solutioning; the approved local plan precedes the first edit; the whole
    existing spec and RuboCop run after the edit; the final handoff preserves each
    quality status and truthfully reports unavailable browser and external evidence.
    Convention adherence: no forbidden servers/consoles/environment overrides,
    no concurrent heavy tasks, and no push or PR side effects.
